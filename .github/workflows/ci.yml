# Builds and tests CLOpts on the five supported toolchains, as both the
# static and the shared library (5 x 2 = 10 jobs).
# A separate abi-compare job checks ABI compatibility with the latest
# release of the same SOVERSION on Linux.
# No release steps here: tag checks and GitHub Releases are not part of CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.toolchain }}-${{ matrix.library }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing toolchain or library form must not cancel the others.
      fail-fast: false
      matrix:
        toolchain:
          - linux-gcc
          - linux-clang
          - macos-appleclang
          - windows-msvc
          - windows-mingw
        library: [static, shared]
        # Per-toolchain settings; each entry extends both library forms.
        include:
          - toolchain: linux-gcc
            os: ubuntu-latest
            shell: bash
            cc: gcc
            configure_args: -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          - toolchain: linux-clang
            os: ubuntu-latest
            shell: bash
            cc: clang
            configure_args: -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          - toolchain: macos-appleclang
            os: macos-latest
            shell: bash
            # Default compiler (Apple Clang).
            cc: ""
            configure_args: -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          - toolchain: windows-msvc
            os: windows-latest
            shell: bash
            cc: ""
            # No -G: CMake picks the newest installed Visual Studio generator
            # (multi-config), so the build type is chosen at build/test time.
            configure_args: ""
            build_args: --config Release
            ctest_args: -C Release
          - toolchain: windows-mingw
            os: windows-latest
            shell: msys2 {0}
            cc: gcc
            configure_args: -G Ninja -DCMAKE_BUILD_TYPE=Release
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      # mingw-w64-ucrt-x86_64-gcc provides g++ as well as gcc; the consumer
      # fixture has a C++ translation unit.
      - name: Set up MSYS2 (UCRT64)
        if: matrix.toolchain == 'windows-mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      # CLOPTS_INSTALL is ON by default at top level, so the test step also
      # runs integration.package_selection (static + shared in one prefix).
      - name: Configure
        run: >-
          cmake -S . -B build -DCLOPTS_WERROR=ON
          -DCLOPTS_BUILD_SHARED=${{ matrix.library == 'shared' && 'ON' || 'OFF' }}
          ${{ matrix.configure_args }}

      - name: Build
        run: cmake --build build ${{ matrix.build_args }}

      - name: Test
        run: ctest --test-dir build ${{ matrix.ctest_args }} --output-on-failure

      # Per-module label filtering (ctest -L <module>), checked on Linux GCC
      # for both library forms.
      - name: Test (label core)
        if: matrix.toolchain == 'linux-gcc'
        run: ctest --test-dir build -L core --output-on-failure

      - name: Test (label toolchain)
        if: matrix.toolchain == 'linux-gcc'
        run: ctest --test-dir build -L toolchain --output-on-failure

      - name: Test (label integration)
        if: matrix.toolchain == 'linux-gcc'
        run: ctest --test-dir build -L integration --output-on-failure

  # Compares the ABI of the current sources with the latest release tag of the
  # same SOVERSION (tests/abi/run_abidiff.cmake). Independent of
  # build-and-test: neither job needs the other.
  abi-compare:
    name: abi-compare
    runs-on: ubuntu-latest
    steps:
      # Full history so the release tags are available as baselines.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install abidiff
        run: sudo apt-get update && sudo apt-get install -y abigail-tools

      # Builds the baseline tag and the current sources in RUNNER_TEMP, then
      # runs abidiff; prints "abi-compare: skipped: ..." when there is no
      # baseline to compare against.
      - name: Compare ABI
        run: >-
          cmake -DSOURCE_DIR=$GITHUB_WORKSPACE -DWORK_DIR=$RUNNER_TEMP/abi
          -DC_COMPILER=gcc -DGENERATOR="Unix Makefiles"
          -P tests/abi/run_abidiff.cmake
